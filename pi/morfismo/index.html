<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Morfismo Temporal · CG·UEPB</title>
    <link rel="icon" href="../../shared/img/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="../../shared/css/app.css">
    <script src="../../shared/js/site.js"></script>
    <style>
        .formula { font-family: var(--font-mono); font-size: 13px; text-align: center; padding: 12px; color: var(--text); background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius); }
    </style>
</head>
<body data-project="pi" data-module="morfismo">
    <main class="page pi-page">
        <div data-stage-head="page" data-hint="Escolha o par criança/adulto e inicie: são 60 quadros interpolando de A para B."></div>

        <div class="pipeline">
            <section class="card">
                <header class="card-head"><h2><span class="step">A</span>Quadro inicial</h2></header>
                <div class="card-body">
                    <div class="image-frame" id="img-a"></div>
                    <div class="field">
                        <label for="img-a-selector">Imagem (criança)</label>
                        <select id="img-a-selector">
                            <option selected value="0">Criança (exemplo)</option>
                            <option value="2">Pedro Lucas (criança)</option>
                            <option value="4">Erick Nathan (criança)</option>
                        </select>
                    </div>
                </div>
            </section>

            <div class="pipeline-arrow"><span data-icon="arrow"></span></div>

            <section class="card">
                <header class="card-head"><h2><span class="step">B</span>Quadro final</h2></header>
                <div class="card-body">
                    <div class="image-frame" id="img-b"></div>
                    <div class="field">
                        <label for="img-b-selector">Imagem (adulto)</label>
                        <select id="img-b-selector">
                            <option selected value="1">Adulto (exemplo)</option>
                            <option value="3">Pedro Lucas (adulto)</option>
                            <option value="5">Erick Nathan (adulto)</option>
                        </select>
                    </div>
                </div>
            </section>

            <div class="pipeline-arrow"><span data-icon="arrow"></span></div>

            <section class="card">
                <header class="card-head"><h2><span class="step">t</span>Morfismo</h2></header>
                <div class="card-body">
                    <div class="image-frame" id="processed-img"></div>
                    <p class="formula">I(t) = (1 − t) · A + t · B,&nbsp; t ∈ [0, 1]</p>
                    <div id="morphed-gif" class="gif-spacing"></div>
                </div>
                <footer class="card-foot">
                    <button id="start-morphing-btn" class="btn btn-primary btn-lg btn-block" type="button"><span data-icon="play"></span>Iniciar morfismo</button>
                </footer>
            </section>
        </div>
    </main>

    <footer data-footer></footer>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.6.0/p5.min.js" integrity="sha512-3RlxD1bW34eFKPwj9gUXEWtdSMC59QqIqHnD8O/NoTwSJhgxRizdcFVQhUMFyTp5RwLTDL0Lbcqtl8b7bFAzog==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="../core/pgm.js"></script>
    <script src="morfismo.js"></script>
</body>
</html>

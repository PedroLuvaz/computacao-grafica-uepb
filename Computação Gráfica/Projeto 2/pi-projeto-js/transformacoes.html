<!doctype html>
<html lang="pt-br">
<head>
  <title>Transformações</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

  <link href="https://fonts.googleapis.com/css?family=Poppins:300,400,500,600,700,800,900" rel="stylesheet">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="wrapper d-flex align-items-stretch">
  <nav id="topbar" class="navbar">
    <div class="navbar-container">
      <a href="index.html" class="logo" style="margin-right: 10px;">Projeto 2 - Imagens</a>
      <ul class="navbar-links">
        <li><a href="filtros.html">Filtros</a></li>
        <li><a href="combinacao.html">Combinação</a></li>
        <li><a href="transformacoes.html">Transformações</a></li>
        <li><a href="histograma.html">Histograma</a></li>
        <li><a href="morfologia.html">Morfologia</a></li>
        <li><a href="morphing.html">Morfismo Temporal</a></li>
      </ul>
    </div>
  </nav>

  <!-- Page Content  -->
  <div id="content" class="p-4 p-md-5 pt-5">
    <main>
        <div class="container-fluid p-0 m-0 justify-content-center d-grid" style="min-height: 400px;">
            <div class="row w-100 p-0 w-0">
                <div class="col-lg-4 mb-2 align-items-center">
                    <div class="card mx-auto" style="width:300px; height: 400px;">
                        <div class="card-body">
                            <h5 class="card-title text-center">Imagem Original</h5>
                            <div class="card-img-top" id="original-img"></div>
                            <div style="width: 256px; height: 50px;" class="text-center">
                                <select class="form-select" aria-label="Selecionar filtro" id="img-selector">
                                    <option selected value="0">Lena</option>
                                    <option value="2">Airplane</option>
                                </select>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-lg-4 mb-2">
                    <div class="card  mx-auto align-items-center" style="width:300px; height: 400px;">
                        <div class="card-body">
                            <h5 class="card-title text-center">Transformação</h5>
                            <div style="width: 280px; height: 25px;" class="text-center">
                                <select class="form-select" aria-label="Selecionar filtro" id="input-filter">
                                    <option selected value="0">Original</option>
                                    <option value="1">Negativo</option>
                                    <option value="2">Transformação Gamma</option>
                                    <option value="3">Transformação Logarítmica</option>
                                    <option value="6">Intensidade Geral</option>
                                    <option value="5">Faixa Dinâmica</option>
                                    <option value="4">Transferência Linear</option>
                                </select>
                            </div>
                            <br>
                            <div class="container text-end" style="width: 280px;">
                                <form id="input-matrix" role="form">
                                    <label style="padding-bottom: 10px">Gamma:
                                        <input type="number" name="array[]" value="1" min="0" max="5" step="0.1"
                                               style="width: 50px; text-align:center" id="gamma" disabled>
                                    </label>
                                    <br>
                                    <label style="padding-bottom: 10px">Log (a):
                                        <input type="number" name="array[]" value="1" min="0" max="10" step=".1"
                                               style="width: 50px; text-align:center" id="log" disabled>
                                    </label>
                                    <label style="padding-bottom: 10px">Intensidade (w) (r):
                                      <input type="number" name="array[]" value="127" step="1"
                                        style="width: 50px; text-align:center" id="intg1" disabled>
                                      <input type="number" name="array[]" value="25" step="1"
                                        style="width: 50px; text-align:center" id="intg2" disabled>
                                    </label>
                                    <label style="padding-bottom: 10px">Faixa Dinâmica:
                                        <input type="number" name="array[]" value="255" step="1"
                                               style="width: 50px; text-align:center" id="dyn" disabled>
                                    </label>
                                    <label style="padding-bottom: 10px">Linear (a) (b):
                                        <input type="number" name="array[]" value="1" step="1"
                                               style="width: 50px; text-align:center" id="lin1" disabled>
                                        <input type="number" name="array[]" value="1" step="1"
                                               style="width: 50px; text-align:center" id="lin2" disabled>
                                    </label>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-lg-4 mb-2">
                    <div class="card  mx-auto align-items-center" style="width:300px; height: 400px;">
                        <div class="card-body">
                            <h5 class="card-title text-center">Imagem Processada</h5>
                            <div class="card-img-top" id="processed-img"></div>
                            <div class="form-check form-switch" style="margin: 10px 0 10px">
                                <input class="form-check-input" type="checkbox" id="normalizeSwitch" style="display:none;">
                            </div>
                            <div class="btn-group d-flex" role="group">
                                <button type="button" class="btn btn-primary" id="apply-again-btn" style="display:none;">
                                    Reusar
                                </button>
                                <button type="button" class="btn btn-outline-dark" id="download-btn" style="display:none;">
                                    Baixar
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.6.0/p5.min.js" integrity="sha512-3RlxD1bW34eFKPwj9gUXEWtdSMC59QqIqHnD8O/NoTwSJhgxRizdcFVQhUMFyTp5RwLTDL0Lbcqtl8b7bFAzog==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="js/bootstrap.min.js"></script>
<script src="js/src/utils.js"></script>
<script src="js/src/transformations.js"></script>
</body>
</html>

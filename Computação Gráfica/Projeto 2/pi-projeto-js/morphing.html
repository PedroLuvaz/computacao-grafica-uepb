<div class="wrapper d-flex align-items-stretch">
  <nav id="sidebar">
    <h1><a href="index.html" class="logo">Projeto Imagem</a></h1>
    <ul class="list-unstyled components mb-5">

  <div id="content" class="p-4 p-md-5 pt-5">
    <main>
      <div class="container-fluid p-0 m-0 justify-content-center d-grid" style="min-height: 450px;">
        <div class="row w-100 p-0">
          <div class="col-lg-6 mb-2 align-items-center">
            <div class="card mx-auto" style="width:300px; height: 450px;">
              <div class="card-body">
                <h5 class="card-title text-center">Imagem Criança (PGM)</h5>
                <input type="file" id="kidImage" accept=".pgm" class="form-control" style="margin-bottom: 20px;">
                <div class="card-img-top" id="kid-img" style="margin-bottom: 35px;"></div>
              </div>
            </div>
          </div>

            <div class="card mx-auto" style="width:300px; height: 450px;">
              <div class="card-body">
                <h5 class="card-title text-center">Imagem Atual (PGM)</h5>
                <input type="file" id="currentImage" accept=".pgm" class="form-control" style="margin-bottom: 20px;">
                <div class="card-img-top" id="current-img" style="margin-bottom: 35px;"></div>
              </div>
            </div>
          </div>
        </div>
        <div class="row w-100 p-0">
          <div class="col-lg-12 mb-2 align-items-center">
            <div class="card mx-auto" style="width:600px; height: 500px;">
              <div class="card-body">
                <h5 class="card-title text-center">Morfismo Temporal (GIF)</h5>
                <div class="card-img-top text-center" id="morphed-gif" style="margin-bottom: 20px;"></div>
